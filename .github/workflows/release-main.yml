name: Release Verification (Main)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify-release:
    name: Production Release Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install System Dependencies (Calibre)
        run: |
          sudo apt-get update
          sudo apt-get install -y calibre

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Production Release Tests
        working-directory: backend
        run: |
          python -m unittest discover -s tests -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Frontend Regression Tests
        run: node --test frontend/tests/*.test.cjs

      - name: Package Production Distribution Bundle
        run: |
          mkdir -p release-dist
          tar --exclude='./.git' \
              --exclude='./backend/.venv' \
              --exclude='./backend/__pycache__' \
              -czvf release-dist/lunabria-production-release.tar.gz .
          ls -lh release-dist/lunabria-production-release.tar.gz

      - name: Upload Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lunabria-production-release
          path: release-dist/lunabria-production-release.tar.gz
          retention-days: 30
